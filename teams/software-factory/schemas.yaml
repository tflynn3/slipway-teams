apiVersion: v1
kind: ConfigMap
metadata:
  name: __TEAM_NAME__-schemas
  namespace: __NAMESPACE__
immutable: true
data:
  build.json: |
    {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "candidateBranch": { "type": "string" },
        "commit": { "type": "string" },
        "summary": { "type": "string" }
      },
      "required": ["candidateBranch", "commit", "summary"]
    }
  review.json: |
    {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "approved": { "type": "boolean" },
        "testedCommit": { "type": "string" },
        "score": { "type": "integer" },
        "summary": { "type": "string" }
      },
      "required": ["approved", "testedCommit", "score", "summary"]
    }
  qa.json: |
    {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "passed": { "type": "boolean" },
        "testedCommit": { "type": "string" },
        "summary": { "type": "string" },
        "bugsFound": {
          "type": "array",
          "items": { "type": "string" }
        },
        "improvements": {
          "type": "array",
          "items": { "type": "string" }
        },
        "metricsSummary": { "type": "string" }
      },
      "required": ["passed", "testedCommit", "summary", "bugsFound", "improvements", "metricsSummary"]
    }
