apiVersion: v1
kind: ConfigMap
metadata:
  name: __TEAM_NAME__-schemas
  namespace: __NAMESPACE__
immutable: true
data:
  hunt.json: |
    {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "focusArea": { "type": "string" },
        "testedTarget": { "type": "string" },
        "candidateBugs": {
          "type": "array",
          "items": { "type": "string" }
        },
        "summary": { "type": "string" }
      },
      "required": ["focusArea", "testedTarget", "candidateBugs", "summary"]
    }
  triage.json: |
    {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "highestSeverity": { "type": "string", "enum": ["none", "low", "medium", "high", "critical"] },
        "confirmedBugs": {
          "type": "array",
          "items": { "type": "string" }
        },
        "nextCycleFocus": { "type": "string" },
        "summary": { "type": "string" }
      },
      "required": ["highestSeverity", "confirmedBugs", "nextCycleFocus", "summary"]
    }
