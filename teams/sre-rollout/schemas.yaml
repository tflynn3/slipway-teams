apiVersion: v1
kind: ConfigMap
metadata:
  name: __TEAM_NAME__-schemas
  namespace: __NAMESPACE__
immutable: true
data:
  observation.json: |
    {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "service": { "type": "string" },
        "ring": { "type": "string" },
        "revision": { "type": "string" },
        "errorRatePct": { "type": "number" },
        "p99LatencyMs": { "type": "number" },
        "anomalies": {
          "type": "array",
          "items": { "type": "string" }
        },
        "summary": { "type": "string" }
      },
      "required": ["service", "ring", "revision", "errorRatePct", "p99LatencyMs", "anomalies", "summary"]
    }
  verdict.json: |
    {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "healthy": { "type": "boolean" },
        "action": { "type": "string", "enum": ["hold", "promote", "rollback"] },
        "confidence": { "type": "number" },
        "summary": { "type": "string" }
      },
      "required": ["healthy", "action", "confidence", "summary"]
    }
